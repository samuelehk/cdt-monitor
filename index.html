<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor competitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --paper:#F2F5F4; --panel:#FFFFFF; --ink:#10201C; --muted:#5A6B66; --line:#D5DEDB; --scrub:#1F6F5F; --scrub-soft:#E1EEEA;
  --alert:#C2412D; --alert-soft:#F8E5E1; --amber:#A86B12; --amber-soft:#F6ECDC; --steel:#4F6475; --steel-soft:#E3E9EE; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --paper:#0E1513; --panel:#16201D; --ink:#E4ECE9; --muted:#93A49F; --line:#2A3733; --scrub:#5BB8A3;
  --scrub-soft:#17312B; --alert:#EE7A63; --alert-soft:#3A1E19; --amber:#E0A74F; --amber-soft:#33281A; --steel:#9DB3C4; --steel-soft:#1E2A33; color-scheme:dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric:tabular-nums; }
a { color:inherit; text-decoration-color:var(--scrub); text-underline-offset:3px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--scrub); outline-offset:2px; }
.wrap { max-width:1240px; margin:0 auto; padding:28px 20px 60px; }
header.top { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:14px; }
header.top h1 { font:500 30px/1.1 "IBM Plex Serif", Georgia, serif; margin:0; }
header.top h1 small { display:block; font:400 14px "IBM Plex Sans", sans-serif; color:var(--muted); margin-top:6px; }
.vitals { display:flex; gap:22px; flex-wrap:wrap; }
.vital { text-align:right; } .vital b { display:block; font:500 26px "IBM Plex Serif", serif; } .vital span { font-size:12px; color:var(--muted); }
.vital.live b { color:var(--scrub); }
.layout { display:grid; grid-template-columns:220px 1fr; gap:28px; margin-top:24px; }
@media (max-width:820px) { .layout { grid-template-columns:1fr; } }
aside h2, main h2 { font:600 13px "IBM Plex Sans", sans-serif; color:var(--muted); margin:0 0 10px; }
.days { list-style:none; margin:0; padding:0; display:grid; gap:2px; max-height:70vh; overflow:auto; }
@media (max-width:820px) { .days { display:flex; overflow-x:auto; max-height:none; } }
.days button { all:unset; cursor:pointer; display:flex; justify-content:space-between; gap:10px; width:100%; padding:8px 10px; border-radius:6px; font-size:14px; white-space:nowrap; }
.days button:hover { background:var(--scrub-soft); }
.days button[aria-current="true"] { background:var(--ink); color:var(--paper); }
.days .n { font-size:12px; padding:0 7px; border-radius:10px; background:var(--alert-soft); color:var(--alert); font-weight:600; }
.days button[aria-current="true"] .n { background:var(--alert); color:#fff; }
.days .n.zero { background:transparent; color:var(--muted); }
.report { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--scrub); border-radius:4px 10px 10px 4px; padding:22px 24px; }
.report h3 { font:500 24px/1.25 "IBM Plex Serif", serif; margin:0 0 4px; }
.report .when { color:var(--muted); font-size:13px; }
.strip { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 6px; }
.tag { display:inline-flex; gap:6px; align-items:baseline; padding:4px 10px; border-radius:999px; font-size:13px; background:var(--steel-soft); color:var(--steel); }
.tag b { font-weight:600; } .tag.hot { background:var(--alert-soft); color:var(--alert); } .tag.warn { background:var(--amber-soft); color:var(--amber); }
.findings { display:grid; gap:18px; margin-top:16px; }
.finding h4 { margin:0 0 6px; font:600 15px "IBM Plex Sans", sans-serif; display:flex; gap:8px; align-items:center; }
.finding h4 i { width:9px; height:9px; border-radius:50%; background:var(--c, var(--steel)); display:inline-block; }
.finding ul { margin:0; padding-left:18px; display:grid; gap:3px; } .finding li { font-size:14px; } .finding li small { color:var(--muted); }
.analysis { margin-top:20px; padding:16px 18px; background:var(--amber-soft); border-radius:8px; font-size:14px; max-width:78ch; }
.empty { color:var(--muted); padding:30px 0; }
nav.tabs { display:flex; gap:4px; margin:34px 0 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
nav.tabs button { all:unset; cursor:pointer; padding:10px 14px; font-weight:500; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-1px; }
nav.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--scrub); }
.tools { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.tools input, .tools select { padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); font:inherit; }
.tools input { flex:1 1 240px; }
.tablebox { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:70vh; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { position:sticky; top:0; background:var(--panel); text-align:left; font-weight:600; font-size:12px; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; }
td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; } td.num { text-align:right; }
tr:hover td { background:var(--scrub-soft); }
.st { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.st.on { background:var(--scrub-soft); color:var(--scrub); } .st.off { background:var(--steel-soft); color:var(--muted); } .st.new { background:var(--alert-soft); color:var(--alert); }
.body { color:var(--muted); font-size:13px; max-width:46ch; }
footer { margin-top:40px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="dom">Monitor competitor<small id="sub">Caricamento dei dati…</small></h1>
    <div class="vitals" id="vitals"></div>
  </header>
  <div class="layout">
    <aside><h2>Giorni controllati</h2><ul class="days" id="days"></ul></aside>
    <main>
      <h2>Referto del giorno</h2>
      <section class="report" id="report"><p class="empty">Nessun controllo ancora. Il primo giro del bot crea la fotografia di partenza.</p></section>
      <nav class="tabs" role="tablist">
        <button role="tab" data-t="products" aria-selected="true">Prodotti</button>
        <button role="tab" data-t="ads" aria-selected="false">Ads</button>
        <button role="tab" data-t="subs" aria-selected="false">Sottodomini</button>
      </nav>
      <div class="tools"><input id="q" type="search" placeholder="Cerca…" aria-label="Cerca"><select id="f" aria-label="Filtro"></select></div>
      <div class="tablebox"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    </main>
  </div>
  <footer>Dati raccolti ogni mattina dai certificati SSL, dalle landing pubbliche e dalla Libreria inserzioni di Meta.</footer>
</div>
<script>
var $ = function (s) { return document.querySelector(s); };
function el(tag, attrs) {
  var e = document.createElement(tag); attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) { if (k === 'class') e.className = attrs[k]; else if (k === 'href') { e.href = attrs[k]; e.target = '_blank'; e.rel = 'noopener'; } else e.setAttribute(k, attrs[k]); });
  for (var i = 2; i < arguments.length; i++) { [].concat(arguments[i]).forEach(function (c) { if (c != null) e.append(c); }); }
  return e;
}
function fmt(d) { return d ? new Date(d + 'T00:00:00Z').toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : ''; }
var LABELS = {
  prodotti_nuovi_in_ads: ['Nuovi prodotti in ads', 'hot', 'var(--alert)'],
  nuovi_sottodomini: ['Nuovi sottodomini', 'hot', 'var(--alert)'],
  ads_nuove: ['Ads nuove', 'hot', 'var(--alert)'],
  pagine_fb_nuove: ['Nuove pagine Facebook', 'hot', 'var(--alert)'],
  prezzi_cambiati: ['Prezzi cambiati', 'warn', 'var(--amber)'],
  checkout_cambiati: ['Checkout cambiati', 'warn', 'var(--amber)'],
  titoli_cambiati: ['Titoli cambiati', 'warn', 'var(--amber)'],
  ads_riaccese: ['Ads riaccese', 'warn', 'var(--amber)'],
  ads_spente: ['Ads spente', '', 'var(--steel)'],
  landing_modificate: ['Landing modificate', '', 'var(--steel)'],
  landing_offline: ['Landing offline', '', 'var(--steel)'],
  sottodomini_spariti: ['Sottodomini spariti', '', 'var(--steel)']
};
var L = null, H = [], day = null, tab = 'products', sortK = null, sortD = -1;
function host(s) { return s === '(root)' ? L.domain : s + '.' + L.domain; }
function count(h) { var n = 0; Object.keys(h.changes || {}).forEach(function (k) { n += h.changes[k].count; }); return n; }

async function load() {
  try {
    var a = await fetch('data/latest.json', { cache: 'no-store' }); if (a.ok) L = await a.json();
    var b = await fetch('data/history.json', { cache: 'no-store' }); if (b.ok) H = await b.json();
  } catch (e) {}
  if (!L) { $('#sub').textContent = 'Il primo controllo è in corso: ricarica la pagina tra qualche minuto.'; return; }
  document.title = 'Monitor · ' + L.domain;
  $('#dom').firstChild.textContent = L.domain;
  $('#sub').textContent = 'Ultimo controllo: ' + fmt(L.date) + (L.totals.ads_aggiornate === false ? ' · ads del controllo precedente' : '');
  var live = L.products.filter(function (p) { return p.active > 0; }).length;
  $('#vitals').replaceChildren(
    el('div', { class: 'vital live' }, el('b', {}, String(L.totals.attive)), el('span', {}, 'ads attive')),
    el('div', { class: 'vital' }, el('b', {}, String(L.totals.ads)), el('span', {}, 'ads viste in totale')),
    el('div', { class: 'vital' }, el('b', {}, String(live)), el('span', {}, 'prodotti in ads ora')),
    el('div', { class: 'vital' }, el('b', {}, String(L.totals.subs)), el('span', {}, 'sottodomini')));
  day = H.length ? H[H.length - 1].date : null;
  drawDays(); drawReport(); drawTable(true);
}

function drawDays() {
  var ul = $('#days'); ul.replaceChildren();
  H.slice().reverse().forEach(function (h) {
    var n = count(h);
    var b = el('button', { 'aria-current': String(h.date === day) }, el('span', {}, fmt(h.date)), el('span', { class: 'n' + (n ? '' : ' zero') }, h.baseline ? 'inizio' : String(n)));
    b.addEventListener('click', function () { day = h.date; drawDays(); drawReport(); });
    ul.append(el('li', {}, b));
  });
}

function headline(h) {
  var c = h.changes || {}, g = function (k) { return c[k] ? c[k].count : 0; };
  if (g('prodotti_nuovi_in_ads')) return g('prodotti_nuovi_in_ads') === 1 ? 'Hanno messo in ads un prodotto nuovo' : 'Hanno messo in ads ' + g('prodotti_nuovi_in_ads') + ' prodotti nuovi';
  if (g('nuovi_sottodomini')) return (g('nuovi_sottodomini') === 1 ? 'Un sottodominio nuovo' : g('nuovi_sottodomini') + ' sottodomini nuovi') + ': stanno preparando un lancio';
  if (g('ads_nuove')) return g('ads_nuove') + ' ads nuove' + (g('ads_spente') ? ', ' + g('ads_spente') + ' spente' : '');
  if (g('ads_spente')) return g('ads_spente') + ' ads spente';
  return 'Modifiche a landing e offerte';
}

function drawReport() {
  var box = $('#report'); box.replaceChildren();
  var h = H.find(function (x) { return x.date === day; });
  if (!h) { box.append(el('p', { class: 'empty' }, 'Nessun controllo ancora.')); return; }
  var n = count(h);
  box.append(el('h3', {}, h.baseline ? 'Fotografia di partenza salvata: da domani vedi le novità' : n ? headline(h) : 'Nessuna novità rispetto al giorno prima'),
    el('div', { class: 'when' }, fmt(h.date) + (h.totals ? ' — ' + h.totals.attive + ' ads attive su ' + h.totals.ads + ', ' + h.totals.subs + ' sottodomini' : '')));
  var strip = el('div', { class: 'strip' }), f = el('div', { class: 'findings' });
  Object.keys(LABELS).forEach(function (k) {
    var c = (h.changes || {})[k]; if (!c || !c.count) return;
    var lab = LABELS[k];
    strip.append(el('span', { class: 'tag ' + lab[1] }, el('b', {}, String(c.count)), lab[0]));
    var ul = el('ul');
    c.items.forEach(function (it) {
      var li = el('li');
      if (it.id) li.append(el('a', { href: 'https://www.facebook.com/ads/library/?id=' + it.id }, it.label), ' ', el('small', {}, '[' + it.product + ']'));
      else if (it.sub) li.append(el('a', { href: 'https://' + host(it.sub) + '/' }, it.label));
      else li.append(it.label);
      if (it.prices && it.prices.length) li.append(' ', el('small', {}, it.prices.join(' · ')));
      ul.append(li);
    });
    if (c.count > c.items.length) ul.append(el('li', {}, el('small', {}, '…e altri ' + (c.count - c.items.length))));
    var dot = el('i'); dot.style.setProperty('--c', lab[2]);
    f.append(el('div', { class: 'finding' }, el('h4', {}, dot, lab[0] + ' (' + c.count + ')'), ul));
  });
  if (strip.children.length) box.append(strip);
  box.append(f);
  if (h.analysis) box.append(el('div', { class: 'analysis' }, h.analysis));
}

var VIEWS = {
  products: {
    cols: [['sub', 'Prodotto'], ['title', 'Titolo'], ['pages', 'Pagina FB'], ['ads', 'Ads'], ['active', 'Attive'], ['new_today', 'Nuove oggi'], ['first', 'Prima ad'], ['last', 'Ultima ad']],
    rows: function () { return L.products; }, filter: ['Tutti', 'Con ads attive', 'Spenti'], sort: 'first',
    match: function (r, f) { return f === 'Con ads attive' ? r.active > 0 : f === 'Spenti' ? r.active === 0 : true; },
    cell: function (r, k) {
      if (k === 'sub') return r.sub === '?' ? '?' : el('a', { href: 'https://' + host(r.sub) + '/' }, r.sub);
      if (k === 'pages') return r.pages.join(', ');
      if (k === 'first') return fmt(r.first);
      if (k === 'last') return r.last ? fmt(r.last) : el('span', { class: 'st on' }, 'in corso');
      if (k === 'new_today') return r.new_today ? el('span', { class: 'st new' }, '+' + r.new_today) : '';
      return String(r[k] == null ? '' : r[k]);
    }
  },
  ads: {
    cols: [['start', 'Avvio'], ['active', 'Stato'], ['product', 'Prodotto'], ['page', 'Pagina FB'], ['title', 'Titolo'], ['body', 'Testo']],
    rows: function () { return L.ads; }, filter: ['Tutte', 'Attive', 'Spente'], sort: 'start',
    match: function (r, f) { return f === 'Attive' ? r.active : f === 'Spente' ? !r.active : true; },
    cell: function (r, k) {
      if (k === 'active') return el('span', { class: 'st ' + (r.active ? 'on' : 'off') }, r.active ? 'Attiva' : 'Spenta ' + fmt(r.stop));
      if (k === 'start') return el('a', { href: 'https://www.facebook.com/ads/library/?id=' + r.id }, fmt(r.start));
      if (k === 'body') return el('div', { class: 'body' }, r.body);
      return String(r[k] == null ? '' : r[k]);
    }
  },
  subs: {
    cols: [['sub', 'Sottodominio'], ['type', 'Tipo'], ['cert', 'Certificato'], ['title', 'Titolo pagina'], ['prices', 'Prezzi'], ['hotmart', 'Checkout Hotmart'], ['http', 'HTTP']],
    rows: function () { return L.subdomains; }, filter: null, sort: 'cert',
    match: function (r, f) { return !f || f === 'Tutti i tipi' || r.type === f; },
    cell: function (r, k) {
      if (k === 'sub') return el('a', { href: 'https://' + host(r.sub) + '/' }, r.sub);
      if (k === 'cert') return fmt(r.cert);
      return Array.isArray(r[k]) ? r[k].join(' ') : String(r[k] == null ? '' : r[k]);
    }
  }
};

document.querySelectorAll('nav.tabs button').forEach(function (b) {
  b.addEventListener('click', function () {
    tab = b.dataset.t; sortK = null; sortD = -1;
    document.querySelectorAll('nav.tabs button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
    drawTable(true);
  });
});
$('#q').addEventListener('input', function () { drawTable(); });
$('#f').addEventListener('change', function () { drawTable(); });

function drawTable(reset) {
  if (!L) return;
  var V = VIEWS[tab];
  if (reset) {
    var opts = V.filter || ['Tutti i tipi'].concat(Array.from(new Set(L.subdomains.map(function (s) { return s.type; }))));
    $('#f').replaceChildren.apply($('#f'), opts.map(function (o) { return new Option(o); }));
  }
  var f = $('#f').value, q = $('#q').value.trim().toLowerCase(), k = sortK || V.sort;
  var rows = V.rows().filter(function (r) { return V.match(r, f) && (!q || JSON.stringify(r).toLowerCase().indexOf(q) >= 0); })
    .sort(function (a, b) { var x = a[k], y = b[k]; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sortD; });
  var tr = el('tr');
  V.cols.forEach(function (c) {
    var th = el('th', { 'aria-sort': c[0] === k ? (sortD > 0 ? 'ascending' : 'descending') : 'none' }, c[1] + (c[0] === k ? (sortD > 0 ? ' ▲' : ' ▼') : ''));
    th.addEventListener('click', function () { sortD = sortK === c[0] ? -sortD : -1; sortK = c[0]; drawTable(); });
    tr.append(th);
  });
  $('#tbl thead').replaceChildren(tr);
  $('#tbl tbody').replaceChildren.apply($('#tbl tbody'), rows.map(function (r) {
    return el('tr', {}, V.cols.map(function (c) { return el('td', { class: (tab === 'products' && ['ads', 'active', 'new_today'].indexOf(c[0]) >= 0) ? 'num' : '' }, V.cell(r, c[0])); }));
  }));
}
load();
</script>
</body>
</html>
